[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-segmentation"
version = "0.1.0"
description = "Biblioteca de estratégias de segmentação de voz"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fireredvad>=0.0.2",
    "huggingface_hub>=1.6.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pydantic>=2.12.5",
    "setuptools>=80.0.0",
    "silero-vad>=6.2.1",
    "soundfile>=0.12.1",
    "webrtcvad>=2.0.10",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9.0",
    "pre-commit>=4.5.1",
    "ruff>=0.4.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_segmentation"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

# --- Ruff ---
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "ANN",
    "D",
]
ignore = [
    "ANN101",
    "ANN102",
    "D100",
    "D104",
]

[tool.ruff.lint.isort]
known-first-party = ["voice_segmentation"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src/voice_segmentation"]

[[tool.mypy.overrides]]
module = "webrtcvad"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "soundfile"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["librosa", "librosa.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "silero_vad"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fireredvad", "fireredvad.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
